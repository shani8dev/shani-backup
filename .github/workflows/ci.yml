name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: python
  test:
    uses: shani8dev/shani-ci-commons/.github/workflows/test.yml@main
    with:
      language: python
      apt-packages: python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin btrfs-progs xvfb
      system-site-packages: true
      # GTK window under Xvfb; the btrfs tests need root for a throwaway
      # loopback filesystem (they skip otherwise, so run them again as root)
      test-command: |
        PYTHONDONTWRITEBYTECODE=1 xvfb-run -a python3 -m pytest tests/ -v -p no:cacheprovider
        sudo PYTHONDONTWRITEBYTECODE=1 "$(command -v python3)" -m pytest tests/ -v -p no:cacheprovider -k btrfs
    needs: lint
  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint
